<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="摸鱼实干奶蛙 · ISTP">
  <defs>
    <clipPath id="card"><rect width="960" height="640" rx="44" /></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="640" fill="#F5A623" opacity="0.14" />
    <circle cx="150" cy="120" r="90" fill="#F5A623" opacity="0.18" />
    <circle cx="830" cy="540" r="120" fill="#F5A623" opacity="0.16" />

    <!-- 奶蛙 -->
    <g transform="translate(400,320)">
      <!-- 脚 -->
      <ellipse cx="-62" cy="196" rx="42" ry="27" fill="#E8B63A" />
      <ellipse cx="62" cy="196" rx="42" ry="27" fill="#E8B63A" />
      <!-- 手 -->
      <ellipse cx="-134" cy="96" rx="32" ry="48" fill="#FFD75E" transform="rotate(-12 -134 96)" />
      <ellipse cx="134" cy="96" rx="32" ry="48" fill="#FFD75E" transform="rotate(12 134 96)" />
      <!-- 身体 -->
      <ellipse cx="0" cy="92" rx="130" ry="114" fill="#FFD75E" />
      <ellipse cx="0" cy="118" rx="82" ry="78" fill="#FFF6DC" />
      <!-- 头 -->
      <circle cx="0" cy="-58" r="118" fill="#FFD75E" />
      <!-- 眼（大眼 + 绿色虹膜，奶蛙的标志） -->
      <circle cx="-46" cy="-94" r="34" fill="#FFFFFF" />
      <circle cx="46" cy="-94" r="34" fill="#FFFFFF" />
      <circle cx="-46" cy="-94" r="23" fill="#8FBE7A" />
      <circle cx="46" cy="-94" r="23" fill="#8FBE7A" />
      <circle cx="-46" cy="-94" r="11.5" fill="#3D2E1B" />
      <circle cx="46" cy="-94" r="11.5" fill="#3D2E1B" />
      <circle cx="-39" cy="-101" r="4.5" fill="#ffffff" />
      <circle cx="53" cy="-101" r="4.5" fill="#ffffff" />
      <!-- 腮红 -->
      <ellipse cx="-88" cy="-34" rx="22" ry="13" fill="#FF9DB0" opacity="0.66" />
      <ellipse cx="88" cy="-34" rx="22" ry="13" fill="#FF9DB0" opacity="0.66" />
      <!-- 宽嘴 -->
      <path d="M-40 -12 q40 26 80 0" fill="none" stroke="#3D2E1B" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- 文字 -->
    <text x="700" y="268" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="96" font-weight="900" fill="#B37100">ISTP</text>
    <text x="700" y="330" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800" fill="#3D2E1B">摸鱼实干奶蛙</text>
    <text x="700" y="382" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#B37100" opacity="0.7">奶蛙家族 · 配图待补</text>
  </g>
</svg>
